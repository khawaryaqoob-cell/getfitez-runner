name: Media Sweep

# Weekly Cloudinary reconciliation (A18): destroys assets under media/ that
# NOTHING in Firestore references anymore and that are older than the 7-day
# grace window (in-flight-upload protection — see scripts/mediaSweep.cjs).
# Spark-safe: FIREBASE_SA_KEY + the three CLOUDINARY_* repo secrets.
on:
  schedule:
    - cron: '15 3 * * 0'   # Sundays 03:15 UTC
  # NO schedule here: cron fires from the PUBLIC runner repo (getfitez-runner)
  # only — the generator injects the schedule into the runner copy.
  workflow_dispatch:
    inputs:
      grace_days:
        description: 'Grace window override (days). 0 = reclaim ALL unreferenced assets now (first-run verification).'
        required: false
        default: '7'

jobs:
  sweep:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

        with:

          repository: khawaryaqoob-cell/be-fit-pro

          ref: main

          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin sdk
        run: npm install firebase-admin@latest --no-audit --fund=false

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then echo "::error::FIREBASE_SA_KEY missing"; exit 1; fi
          printf '%s' "$SA_KEY" > scripts/be-fit-pro-sa.json

      - name: Sweep orphaned media
        env:
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GRACE_DAYS: ${{ github.event.inputs.grace_days || '7' }}
        # dry-run FIRST so a config problem never destroys anything; then the
        # real sweep. Both log fully — the Actions history is the audit trail.
        run: |
          node scripts/mediaSweep.cjs --grace-days="$GRACE_DAYS"
          node scripts/mediaSweep.cjs --confirm --grace-days="$GRACE_DAYS"
