name: Process Email Queue

# Delivers queued emails (Admin › Emails → emailQueue) through each org's own
# connected sending account (gym → reseller → platform tiers). Spark-safe:
# GitHub cron instead of Cloud Functions.
#
# The instance matrix is GENERATED from scripts/instances/fleet.json by
# scripts/genEmailMatrix.cjs (commit the regenerated file when fleet.json
# changes). Each matrix leg needs a repo secret named <INSTANCE_UPPER>_SA_KEY
# (contents of scripts/<instance>-sa.json); the master keeps the legacy
# FIREBASE_SA_KEY name. EMAIL_CRED_PRIVATE_KEY is fleet-shared — the browser
# encrypts with the same public key on every instance.
on:
  schedule:
    - cron: '20 * * * *'   # 20 past every hour
  # NO schedule here: cron fires from the PUBLIC runner repo (getfitez-runner)
  # only — the generator injects the schedule into the runner copy.
  workflow_dispatch: {}      # manual / "send now" relay trigger

jobs:
  dispatch:

    strategy:
      matrix:
        include:
          - instance: be-fit-pro
            secret: FIREBASE_SA_KEY
          - instance: getfitez1
            secret: GETFITEZ1_SA_KEY
            # ← generated: add one leg per fleet.json instance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

        with:

          repository: khawaryaqoob-cell/be-fit-pro

          ref: main

          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        # firebase-admin + nodemailer are all the dispatcher needs — targeted
        # install keeps "send now" round-trips fast.
        run: npm install firebase-admin@latest nodemailer@latest --no-audit --fund=false

      - name: Restore service account key (${{ matrix.instance }})
        env:
          SA_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$SA_KEY" ]; then echo "::error::${{ matrix.secret }} missing (repo → Settings → Secrets and variables → Actions)"; exit 1; fi
          printf '%s' "$SA_KEY" > scripts/${{ matrix.instance }}-sa.json

      - name: Restore credential decryption key
        env:
          PRIV: ${{ secrets.EMAIL_CRED_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIV" ]; then
            echo "::error::EMAIL_CRED_PRIVATE_KEY is EMPTY or not a REPOSITORY secret — Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Secret present: $(echo "$PRIV" | wc -l) lines, $(printf '%s' "$PRIV" | wc -c) bytes"
          {
            echo "EMAIL_CRED_PRIVATE_KEY<<EOF"
            printf '%s\n' "$PRIV"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "EMAIL_CRED_PRIVATE_KEY restored ✓"

      - name: Deliver queued emails (${{ matrix.instance }})
        run: node scripts/processEmailQueue.cjs --instance=${{ matrix.instance }} --confirm
