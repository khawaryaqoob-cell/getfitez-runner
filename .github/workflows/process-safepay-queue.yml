# Source of truth: khawaryaqoob-cell/be-fit-pro @ .github/workflows/process-safepay-queue.yml
#
# This repo holds workflow YAML and nothing else. Each job checks out the
# PRIVATE repo and runs the real scripts from there.
#
# After editing the private copy, regenerate and push:
#   node scripts/generateRunnerRepo.cjs
#   (then copy .runner-repo-out/.github/workflows into getfitez-runner)
#
# Secrets required on the RUNNER repo: PRIVATE_REPO_TOKEN (contents:read on)
# khawaryaqoob-cell/be-fit-pro. Per-instance: add <INSTANCE_UPPER>_SA_KEY once per instance.
# The runner repo does NOT store the secret values itself - it only holds the
