# GENERATED — source of truth is the PRIVATE repo:
#   khawaryaqoob-cell/be-fit-pro @ .github/workflows/nudge-planner.yml
#
# This public repo exists ONLY to run the scheduled jobs on a free, high-priority
# runner pool. It contains workflow YAML and nothing else: no application code,
# no business logic, no secrets in source. Each job checks out the PRIVATE repo
# with PRIVATE_REPO_TOKEN and runs the real scripts from there.
#
# To change a schedule or a step, edit the PRIVATE repo's copy and re-run
#   node scripts/generateRunnerRepo.cjs
# (copy that script into the private repo) — never hand-edit the file here.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PRIVATE_REPO_TOKEN    fine-grained PAT, contents:read on be-fit-pro ONLY
#   FIREBASE_SA_KEY       master instance service account
#   GETFITEZ1_SA_KEY      getfitez1 instance service account
#   SAFEPAY_SECRET_KEY    SafePay secret key (sandbox)
#   SAFEPAY_MERCHANT_API_KEY
#   EMAIL_CRED_PRIVATE_KEY + 3 × Cloudinary keys (email + media workflows)
#
# The Apps Script relay dispatches workflow_dispatch at a hardcoded repo. Until
# it is repointed here, relay pings still land on the PRIVATE repo — so the
# cron path benefits from the public runner while the "Send now" fast path does
# not. See README.md.
name: Daily Nudge Planner

# Stage 4.1 — the Nudge Brain (MEMBER_EXPERIENCE_ROADMAP.md §4.1). The daily
# rules job scans members and queues motivation pushes (streak-break,
# no-log-today, milestone-hit, program-ending) into pushQueue; the existing
# Process Push Queue dispatcher delivers them one hour later. Spark-safe:
# GitHub cron instead of Cloud Functions. The instance matrix is GENERATED
# from scripts/instances/fleet.json by scripts/genFleetMatrix.cjs (commit the
# regenerated file when fleet.json changes). Each matrix leg needs a repo
# secret named <INSTANCE_UPPER>_SA_KEY (contents of scripts/<instance>-sa.json);
# the master keeps the legacy FIREBASE_SA_KEY name.
on:
  schedule:
    - cron: '0 4 * * *'      # 04:00 UTC — before the 05:00 push dispatcher
  workflow_dispatch: {}      # manual run button

jobs:
  plan:

    strategy:
      matrix:
        include:
          - instance: be-fit-pro
            secret: FIREBASE_SA_KEY
          - instance: getfitez1
            secret: GETFITEZ1_SA_KEY
            # ← generated: add one leg per fleet.json instance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: khawaryaqoob-cell/be-fit-pro
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-admin
        run: npm install firebase-admin@latest --no-audit --fund=false

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::${{ matrix.secret }} secret is NOT set (or empty)."
            echo "Fix: repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          printf '%s' "$SA_KEY" > scripts/${{ matrix.instance }}-sa.json
          node -e "const j=JSON.parse(require('fs').readFileSync('scripts/${{ matrix.instance }}-sa.json','utf8'));console.log('SA key valid ✓ project:',j.project_id)"

      - name: Plan nudges (queue motivation pushes)
        run: node scripts/nudgePlanner.cjs --instance=${{ matrix.instance }} --confirm
