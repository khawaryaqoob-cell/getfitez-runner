name: Reconcile Seat Counters (nightly)

# ACTIVE SEATS v2 backstop. The shipped client PAIRS counter moves with the
# membership writes that justify them (promotionPaired / joinCapBumpValid /
# txSetMemberStatus), and firestore.rules pin the arithmetic — but a
# hand-rolled Admin-SDK write, a partial batch, or historical pre-v2 drift can
# still leave codeCaps.{admin,trainer}.active or orgsSubs.memberCount
# disagreeing with the true count of ACTIVE profiles. This nightly recount
# heals that drift fleet-wide (BL11: the reconcile is the backstop, never the
# primary mechanism — rules stay the wall).
#
# Spark-safe: GitHub cron, no Cloud Functions (AGENTS.md §1 — no request-path
# backend runtime). Same instance-matrix scheme as finance-nightly.yml
# (generated from scripts/instances/fleet.json — regenerate when fleet.json
# changes). Dry-run by default; --confirm makes it write.
on:
  schedule:
    - cron: '45 3 * * *'   # 03:45 UTC - after finance (03:30), before nudges (04:00)
  # NO schedule here: cron fires from the PUBLIC runner repo (getfitez-runner)
  # only, so the two repos cannot double-fire. The generator
  # (scripts/generateRunnerRepo.cjs) injects the schedule into the runner copy.
  workflow_dispatch: {}      # manual run button / relay fast path

jobs:
  reconcile:

    strategy:
      matrix:
        include:
          - instance: be-fit-pro
            secret: FIREBASE_SA_KEY
          - instance: getfitez1
            secret: GETFITEZ1_SA_KEY
            # ← generated: add one leg per fleet.json instance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: khawaryaqoob-cell/be-fit-pro
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-admin
        run: npm install firebase-admin@latest --no-audit --fund=false

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::${{ matrix.secret }} secret is NOT set (or empty)."
            echo "Fix: repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          printf '%s' "$SA_KEY" > scripts/${{ matrix.instance }}-sa.json
          node -e "const j=JSON.parse(require('fs').readFileSync('scripts/${{ matrix.instance }}-sa.json','utf8'));console.log('SA key valid ✓ project:',j.project_id)"

      - name: Relay canary (a dead payment relay must go RED, never silent)
        # reports/PAYMENT_TRIGGER_ROOT_CAUSE.md §B4 — the 2026-10-23 incident:
        # both Apps Script GH PATs died and nothing noticed for ~7 days.
        run: node scripts/relayCanary.cjs --instance=${{ matrix.instance }}

      - name: Reconcile seat counters
        # ALWAYS RUN (2026-10-26): a RED relay canary must never skip healing.
        # The canary sits above as the alarm and still turns the run red, but
        # until now its failure skipped this step — so a dead relay PAT also
        # silenced seat reconciliation and codeCaps sync (observed 3 nights:
        # 10-24/25/26, last success 10-23). Seat recount, codeCaps mirror and
        # orgSubs backfill must survive a broken relay.
        if: always()
        run: node scripts/syncCodeCaps.cjs ${{ matrix.instance }} --confirm

      - name: Reconcile online payments vs business ledger
        # Money-received-vs-income alarm, never a repair: the script only reads.
        # Every settled SafePay intent (member_fee / program_sale) must have its
        # businessLedger income row — settle writes both in one transaction, so a
        # stale runner copy or a hand-marked intent is the only way one goes
        # missing, and it used to leave received money invisible in the books.
        # ALWAYS RUN: a RED relay canary or a failed seat recount must not hide a
        # paid intent with no income line. Exit 1 = money in the gateway with no
        # income row (this leg goes red); exit 2 = the SA key was unreadable, also
        # a failure rather than a silent pass.
        if: always()
        run: node scripts/reconcileSafepayLedger.cjs ${{ matrix.instance }} --report-dir=reports/safepay-ledger

      - name: Upload the online-payments reconciliation report
        # Saved for later review: the run log expires, the report is what you
        # open when someone asks why a night went red (or asks what the online
        # receipts were). Uploaded on failure too — that is when it matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safepay-ledger-${{ matrix.instance }}
          path: reports/safepay-ledger/
          retention-days: 30
          if-no-files-found: warn
