name: Finance Nightly Sweep

# docs/Types_Packages of Memberships.md gap 4: overdue status only advanced
# when an admin opened the dashboard, so the defaulter table was stale until
# someone looked. This daily pass flips stale statuses so the Members &
# Payments table is true every morning. Spark-safe: GitHub cron, no Cloud
# Functions. Same instance-matrix scheme as nudge-planner.yml (generated from
# scripts/instances/fleet.json — regenerate when fleet.json changes).
on:
  schedule:
    - cron: '30 3 * * *'     # 03:30 UTC — before nudges (04:00) and push dispatch (05:00)
  workflow_dispatch: {}      # manual run button

jobs:
  sweep:

    strategy:
      matrix:
        include:
          - instance: be-fit-pro
            secret: FIREBASE_SA_KEY
          - instance: getfitez1
            secret: GETFITEZ1_SA_KEY
            # ← generated: add one leg per fleet.json instance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: khawaryaqoob-cell/be-fit-pro
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-admin
        run: npm install firebase-admin@latest --no-audit --fund=false

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::${{ matrix.secret }} secret is NOT set (or empty)."
            echo "Fix: repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          printf '%s' "$SA_KEY" > scripts/${{ matrix.instance }}-sa.json
          node -e "const j=JSON.parse(require('fs').readFileSync('scripts/${{ matrix.instance }}-sa.json','utf8'));console.log('SA key valid ✓ project:',j.project_id)"

      - name: Sweep overdue statuses
        run: node scripts/financeSweep.cjs --instance=${{ matrix.instance }} --confirm
