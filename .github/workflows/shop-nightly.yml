name: Gym Shop Nightly Pass

# Expires stale unpaid reservations (72h hold) and processes member
# cancellation requests — the trusted-side passes the client cannot do
# (member stock writes are structurally decrement-only). Spark-safe:
# GitHub cron + FIREBASE_SA_KEY, same pattern as Process Push Queue.
on:
  schedule:
    - cron: '40 19 * * *'   # nightly 19:40 UTC
  # NO schedule here: cron fires from the PUBLIC runner repo (getfitez-runner)
  # only — the generator injects the schedule into the runner copy.
  workflow_dispatch: {}      # manual run button

jobs:
  nightly:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

        with:

          repository: khawaryaqoob-cell/be-fit-pro

          ref: main

          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin sdk
        run: npm install firebase-admin@latest --no-audit --fund=false

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then echo "::error::FIREBASE_SA_KEY missing"; exit 1; fi
          printf '%s' "$SA_KEY" > scripts/be-fit-pro-sa.json

      - name: Run shop pass
        run: node scripts/shopNightly.cjs --confirm
