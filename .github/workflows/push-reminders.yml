name: Daily Push Reminders

# Spark-safe scheduled pushes (ARCHITECTURE_SAAS.md §12: GitHub cron instead of
# scheduled Cloud Functions). Runs the sendPush script in --reminders mode once
# per day. Add the repository secret FIREBASE_SA_KEY (already required by the
# regression gate) — no extra secrets needed.
on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 18:00 PKT
  # NO schedule here: cron fires from the PUBLIC runner repo (getfitez-runner)
  # only — the generator injects the schedule into the runner copy.
  workflow_dispatch: {}    # manual run button for testing

jobs:
  reminders:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

        with:

          repository: khawaryaqoob-cell/be-fit-pro

          ref: main

          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-tools deps (admin sdk)
        run: npm ci --omit=dev --no-audit --fund=false || npm install firebase-admin --no-audit --fund=false

      - name: Restore service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then echo "::error::FIREBASE_SA_KEY missing"; exit 1; fi
          printf '%s' "$SA_KEY" > scripts/be-fit-pro-sa.json

      - name: Send daily reminders
        run: node scripts/sendPush.cjs --reminders --confirm
